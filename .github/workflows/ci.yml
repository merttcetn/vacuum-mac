name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen.sh

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Verify generated project
        run: |
          test -d Vacuum.xcodeproj
          xcodebuild -project Vacuum.xcodeproj -list

      - name: Run unit, integration, and UI tests
        run: |
          xcodebuild \
            -project Vacuum.xcodeproj \
            -scheme Vacuum \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            test \
            -quiet

      - name: Build unsigned universal application
        run: |
          xcodebuild \
            -project Vacuum.xcodeproj \
            -scheme Vacuum \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            -quiet

      - name: Verify universal binary
        run: scripts/verify-universal.sh DerivedData/Build/Products/Release/Vacuum.app
