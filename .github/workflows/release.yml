name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    environment:
      name: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Validate release tag and secrets
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]
          for name in \
            CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD DEVELOPER_ID_APPLICATION \
            DEVELOPMENT_TEAM NOTARY_APPLE_ID NOTARY_PASSWORD NOTARY_TEAM_ID \
            SPARKLE_PRIVATE_KEY_BASE64
          do
            test -n "${!name}"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Config/Info.plist)" \
            = 'BPMPrYoWdQx+I2QVxLNwHxC552Af8SnP55R8alKI28Q='

      - name: Install pinned XcodeGen
        run: scripts/install-xcodegen.sh

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Run release tests
        run: |
          xcodebuild \
            -project Vacuum.xcodeproj \
            -scheme Vacuum \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            test \
            -quiet

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="${RUNNER_TEMP}/vacuum-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "${CERTIFICATE_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/developer-id.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${RUNNER_TEMP}/developer-id.p12" \
            -P "${CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"

      - name: Archive signed universal app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          xcodebuild archive \
            -project Vacuum.xcodeproj \
            -scheme Vacuum \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "${RUNNER_TEMP}/Vacuum.xcarchive" \
            -derivedDataPath DerivedData \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${DEVELOPER_ID_APPLICATION}" \
            DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM}" \
            OTHER_CODE_SIGN_FLAGS='--timestamp' \
            -quiet

      - name: Verify archive
        run: |
          scripts/verify-universal.sh "${RUNNER_TEMP}/Vacuum.xcarchive/Products/Applications/Vacuum.app"
          codesign --verify --deep --strict --verbose=2 \
            "${RUNNER_TEMP}/Vacuum.xcarchive/Products/Applications/Vacuum.app"

      - name: Notarize and staple application
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          APP_PATH="${RUNNER_TEMP}/Vacuum.xcarchive/Products/Applications/Vacuum.app"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${RUNNER_TEMP}/notarization.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/notarization.zip" \
            --apple-id "${NOTARY_APPLE_ID}" \
            --password "${NOTARY_PASSWORD}" \
            --team-id "${NOTARY_TEAM_ID}" \
            --wait
          xcrun stapler staple "${APP_PATH}"

      - name: Create DMG and ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/create-release-artifacts.sh \
            "${RUNNER_TEMP}/Vacuum.xcarchive/Products/Applications/Vacuum.app" \
            "${VERSION}" \
            "${RUNNER_TEMP}/release"

      - name: Notarize and staple DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_PATH="${RUNNER_TEMP}/release/Vacuum-${VERSION}.dmg"
          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${NOTARY_APPLE_ID}" \
            --password "${NOTARY_PASSWORD}" \
            --team-id "${NOTARY_TEAM_ID}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"
          scripts/verify-release.sh \
            "${RUNNER_TEMP}/Vacuum.xcarchive/Products/Applications/Vacuum.app" \
            "${DMG_PATH}"
          pushd "${RUNNER_TEMP}/release" >/dev/null
          shasum -a 256 \
            "Vacuum-${VERSION}.zip" \
            "Vacuum-${VERSION}.dmg" > "SHA256SUMS.txt"
          popd >/dev/null

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          KEY_PATH="${RUNNER_TEMP}/sparkle-private-key"
          APPCAST_INPUT="${RUNNER_TEMP}/appcast-input"
          echo "${SPARKLE_PRIVATE_KEY_BASE64}" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          mkdir -p "${APPCAST_INPUT}"
          cp "${RUNNER_TEMP}/release/Vacuum-${VERSION}.zip" "${APPCAST_INPUT}/"
          GENERATE_APPCAST="$(scripts/find-sparkle-tool.sh DerivedData generate_appcast)"
          "${GENERATE_APPCAST}" \
            --ed-key-file "${KEY_PATH}" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            "${APPCAST_INPUT}"
          test -s "${APPCAST_INPUT}/appcast.xml"
          rg 'sparkle:edSignature' "${APPCAST_INPUT}/appcast.xml"
          cp "${APPCAST_INPUT}/appcast.xml" "${RUNNER_TEMP}/release/appcast.xml"
          find "${APPCAST_INPUT}" -name '*.delta' -exec cp {} "${RUNNER_TEMP}/release/" \;

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/release/Vacuum-*.zip
            ${{ runner.temp }}/release/Vacuum-*.dmg
            ${{ runner.temp }}/release/SHA256SUMS.txt
            ${{ runner.temp }}/release/*.delta

      - name: Prepare GitHub Pages appcast
        run: |
          mkdir -p "${RUNNER_TEMP}/pages"
          cp "${RUNNER_TEMP}/release/appcast.xml" "${RUNNER_TEMP}/pages/appcast.xml"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/vacuum-signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/developer-id.p12" "${RUNNER_TEMP}/sparkle-private-key"

  deploy-appcast:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy appcast to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
